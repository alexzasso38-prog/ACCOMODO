server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream api:8000;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self' http://localhost:8081 http://127.0.0.1:8081; base-uri 'self'; form-action 'self'" always;
    location /api/ { proxy_pass http://$api_upstream$request_uri; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /health { proxy_pass http://$api_upstream$request_uri; }
    location /ready { proxy_pass http://$api_upstream$request_uri; }
    location / { try_files $uri $uri/ /index.html; }
}
